name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Chronos offline unit tests
        working-directory: chronos
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify protocol_v2 parity (shared vs agent_code)
        run: |
          diff -q shared/protocol_v2.py chronos/chronos/agent_code/protocol_v2.py
          diff -q shared/protocol_v2.py epoch/c2_code/protocol_v2.py
